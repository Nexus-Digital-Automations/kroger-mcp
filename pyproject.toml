[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kroger-mcp"
version = "0.2.0"
description = "FastMCP server for Kroger API integration"
license = {file = "LICENSE"}
authors = [
    {name = "Stephen Thoemmes", email = "thoemmes.stephen@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["kroger", "mcp", "grocery", "shopping", "retail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Office/Business",
]

dependencies = [
    "fastmcp>=2.0.0",
    "kroger-api>=0.2.0",
    "requests",
    "pydantic>=2.0.0",
    "python-dotenv",
    "uvicorn",
    "fastapi>=0.100.0",
    "jinja2>=3.1.0",
    "bcrypt>=4.0",
    "psycopg[binary,pool]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "black",
    "mypy",
]

[project.scripts]
kroger-mcp = "kroger_mcp.server:main"
kroger-mcp-cli = "kroger_mcp.cli:main"
kroger-web = "kroger_mcp.web.app:run"
kroger-stop = "kroger_mcp.web.app:stop"

[project.urls]
Homepage = "https://github.com/CupOfOwls/kroger-mcp"
Repository = "https://github.com/CupOfOwls/kroger-mcp"
Issues = "https://github.com/CupOfOwls/kroger-mcp/issues"
Kroger_Documentation = "https://developer.kroger.com/documentation/public/"

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
testpaths = ["tests/unit", "tests"]

# Bandit security scanner config.
# `exclude_dirs` skips test trees entirely — pytest is built on `assert`, so
# B101 (assert_used) findings in tests/ are noise rather than security risk.
# `skips` removes globally:
#   B101 — assert_used; only meaningful in tests (already excluded) and
#          intentional in a few prod assert-as-invariant call sites.
#   B110 — try/except/pass; widely used here as a best-effort guard around
#          optional pantry/analytics/notion lookups where failure must not
#          break the parent request. Real silent-error bugs are caught in
#          review, not by this heuristic.
#   B608 — hardcoded_sql_expressions. Every SQL site in this repo uses the
#          parameterised pattern: f-strings interpolate ONLY structural
#          fragments built from internal constants (column names from a
#          static map, ',' .join('?'*n) placeholders sized by a Python
#          collection length, module-level SQL constants like
#          _SLOT_ORDER_SQL). Values are always bound via `?` placeholders.
#          Code review enforces this — any new f-string SQL that interpolates
#          a value (not a structural fragment) must be rejected.
[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101", "B110", "B608"]

# Ruff: linter + import sorter. Black handles formatting; ruff stays out of formatter conflicts.
# Why select these rule families:
#   E,F,W — core pyflakes/pycodestyle errors
#   I     — import order (replaces isort)
#   B     — bugbear (likely-bugs)
#   UP    — pyupgrade (3.10+ syntax)
#   SIM   — simplify (anti-patterns)
# E501 (line length) ignored at file level — black enforces width; ruff would double-report.
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".cache",
    ".validation-artifacts",
    ".playwright-mcp",
    "python-scripts",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Suppression rationale (each entry must justify itself):
#   E501   — line length is owned by black, not ruff
#   B008   — function call in default arg is FastAPI/Pydantic idiom (Depends, Field)
#   SIM105 — try/except/pass is being replaced with @handle_errors decorator in Phase 2;
#            enabling now would force two passes of churn over the same lines.
#   SIM102/103/108/116 — readability preferences (collapse nested if, ternary, dict-lookup
#            for if-elif). Codebase consistently prefers explicit forms; not bug-class.
ignore = ["E501", "B008", "SIM105", "SIM102", "SIM103", "SIM108", "SIM116"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM", "UP"]
"src/kroger_mcp/__init__.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
/(
    \.cache
  | \.validation-artifacts
  | \.playwright-mcp
  | python-scripts
)/
'''

# mypy starts non-strict — analytics/ has hundreds of latent typing errors that aren't this spec's
# scope. Tighten in a later spec once the surface is clean. # @internal
[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["python-scripts/", "tests/", "\\.cache/"]

[tool.hatch.build.targets.wheel]
packages = ["src/kroger_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "types-requests>=2.33.0.20260518",
]
