<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Smart Shopper{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['DM Sans', 'sans-serif'],
            serif: ['Lora', 'serif'],
          }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    :root {
      --cream:        oklch(97% 0.012 80);
      --surface:      oklch(99.5% 0.005 80);
      --border:       oklch(88% 0.018 80);
      --text-1:       oklch(18% 0.025 80);
      --text-2:       oklch(44% 0.03 80);
      --text-3:       oklch(62% 0.02 80);
      --sidebar-bg:   oklch(21% 0.065 155);
      --sidebar-border: oklch(28% 0.07 152);
      --sidebar-link: oklch(68% 0.05 152);
      --sidebar-hover-bg: oklch(28% 0.07 152);
      --sidebar-hover: oklch(88% 0.04 150);
      --sidebar-section: oklch(48% 0.09 150);
      --green:        oklch(48% 0.14 148);
      --green-light:  oklch(88% 0.06 148);
      --amber:        oklch(72% 0.165 72);
      --amber-dark:   oklch(55% 0.16 68);
      --amber-text:   oklch(20% 0.05 70);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--cream);
      color: var(--text-1);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Sidebar ─────────────────────────────── */
    .ss-sidebar {
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
    }

    .ss-brand {
      font-family: 'Lora', serif;
      font-weight: 600;
      font-size: 0.9375rem;
      letter-spacing: -0.015em;
      color: oklch(92% 0.035 150);
    }

    .ss-brand-icon {
      background-color: var(--amber);
      color: var(--amber-text);
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 0.375rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-group-label {
      padding: 1.125rem 0.875rem 0.3rem;
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.11em;
      color: var(--sidebar-section);
      text-transform: uppercase;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.46rem 0.875rem;
      border-radius: 0.4375rem;
      font-size: 0.8125rem;
      font-weight: 400;
      color: var(--sidebar-link);
      transition: color 0.12s ease, background-color 0.12s ease;
      letter-spacing: 0.005em;
    }
    .sidebar-link svg {
      opacity: 0.65;
      flex-shrink: 0;
    }
    .sidebar-link:hover {
      background-color: var(--sidebar-hover-bg);
      color: var(--sidebar-hover);
    }
    .sidebar-link:hover svg { opacity: 0.9; }

    .sidebar-link.active {
      background-color: var(--amber);
      color: var(--amber-text);
      font-weight: 600;
    }
    .sidebar-link.active svg { opacity: 1; }
    .sidebar-link.active:hover {
      background-color: oklch(66% 0.18 70);
    }

    /* ── Page chrome ─────────────────────────── */
    .ss-header {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      height: 3.5rem;
      display: flex;
      align-items: center;
      padding: 0 2rem;
    }

    .ss-page-title {
      font-family: 'Lora', serif;
      font-weight: 600;
      font-size: 1.125rem;
      color: var(--text-1);
      letter-spacing: -0.01em;
    }

    /* ── Shared component helpers ────────────── */
    .ss-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
    }

    .ss-btn-primary {
      background-color: var(--green);
      color: white;
      font-weight: 500;
      font-size: 0.8125rem;
      padding: 0.45rem 1rem;
      border-radius: 0.5rem;
      transition: background-color 0.12s;
    }
    .ss-btn-primary:hover { background-color: oklch(42% 0.15 148); }

    .ss-input {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8125rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.45rem 0.75rem;
      background-color: var(--surface);
      color: var(--text-1);
      outline: none;
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .ss-input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px oklch(88% 0.06 148);
    }

    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="min-h-screen flex">

  <!-- Sidebar -->
  <aside class="ss-sidebar fixed inset-y-0 left-0 w-56 flex flex-col z-10">

    <!-- Brand -->
    <div class="h-14 flex items-center px-4 flex-shrink-0" style="border-bottom: 1px solid var(--sidebar-border);">
      <div class="flex items-center gap-2.5">
        <div class="ss-brand-icon">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
              d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.4 5M17 13l1.4 5M9 18a1 1 0 100 2 1 1 0 000-2zm8 0a1 1 0 100 2 1 1 0 000-2z"/>
          </svg>
        </div>
        <span class="ss-brand">Smart Shopper</span>
      </div>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-2 py-2 overflow-y-auto">

      <a href="/dashboard" class="sidebar-link {% if active_page == 'dashboard' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Dashboard
      </a>

      <p class="nav-group-label">Shop</p>
      <a href="/products" class="sidebar-link {% if active_page == 'products' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        Products
      </a>
      <a href="/cart" class="sidebar-link {% if active_page == 'cart' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.4 5M17 13l1.4 5M9 18a1 1 0 100 2 1 1 0 000-2zm8 0a1 1 0 100 2 1 1 0 000-2z"/>
        </svg>
        Cart
      </a>
      <a href="/shopping-list" class="sidebar-link {% if active_page == 'shopping_list' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
        </svg>
        Shopping List
      </a>
      <a href="/deals" class="sidebar-link {% if active_page == 'deals' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a2 2 0 012-2z"/>
        </svg>
        Deals
      </a>

      <p class="nav-group-label">Manage</p>
      <a href="/pantry" class="sidebar-link {% if active_page == 'pantry' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
        Pantry
      </a>
      <a href="/favorites" class="sidebar-link {% if active_page == 'favorites' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
        </svg>
        Favorites
      </a>
      <a href="/recipes" class="sidebar-link {% if active_page == 'recipes' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        </svg>
        Recipes
      </a>

      <p class="nav-group-label">Plan</p>
      <a href="/meal-plan" class="sidebar-link {% if active_page == 'meal_plan' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        Meal Plan
      </a>
      <a href="/predictions" class="sidebar-link {% if active_page == 'predictions' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
        </svg>
        Predictions
      </a>
      <a href="/analytics" class="sidebar-link {% if active_page == 'analytics' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        Analytics
      </a>

      <p class="nav-group-label">Config</p>
      <a href="/safety" class="sidebar-link {% if active_page == 'safety' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
        Safety
      </a>
      <a href="/settings" class="sidebar-link {% if active_page == 'settings' %}active{% endif %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        Settings
      </a>

    </nav>
  </aside>

  <!-- Main -->
  <main class="ml-56 flex-1 min-h-screen flex flex-col">
    <header class="ss-header flex-shrink-0">
      <h1 class="ss-page-title">{% block heading %}{% endblock %}</h1>
    </header>
    <div class="p-8 flex-1">
      {% block content %}{% endblock %}
    </div>
  </main>

</body>
</html>
