{% extends "base.html" %}
{% block title %}Shopping List — Smart Shopper{% endblock %}
{% block heading %}Shopping List{% endblock %}
{% block content %}

<script>
function shoppingListData() {
  return {
    items: {{ items | tojson }},
    loading: false,
    msg: '',
    msgLevel: 'success',          // 'success' | 'error'

    // Send-to-Kroger-cart modal state. The two-phase flow mirrors the
    // /api/shopping-list/add-to-cart contract: previewLoading covers the
    // confirm:false call, sendBusy covers the confirm:true call.
    previewOpen: false,
    previewLoading: false,
    previewData: null,            // server response from confirm:false
    modality: 'PICKUP',           // 'PICKUP' | 'DELIVERY'
    sendBusy: false,

    async reload() {
      const r = await fetch('/api/shopping-list');
      if (r.ok) {
        const d = await r.json();
        this.items = d.items || [];
      }
    },

    displayName(item) {
      return item.name || item.ingredient_name || item.product_id || 'Unknown';
    },

    async removeItem(itemId, productId) {
      const id = itemId || productId;
      if (!id) return;
      await fetch('/api/shopping-list/' + id, {method: 'DELETE'});
      await this.reload();
    },

    async clearList() {
      if (!confirm('Clear all items from your shopping list?')) return;
      await fetch('/api/shopping-list', {method: 'DELETE'});
      await this.reload();
    },

    async adjustQty(item, delta) {
      const newQty = Math.max(1, (item.quantity || 1) + delta);
      await fetch('/api/shopping-list/' + item.id, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({quantity: newQty})
      });
      await this.reload();
    },

    async setQty(item, val) {
      const newQty = Math.max(0.25, parseFloat(val) || 1);
      if (newQty === (item.quantity || 1)) return;
      await fetch('/api/shopping-list/' + item.id, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({quantity: newQty})
      });
      await this.reload();
    },

    // Open the preview modal: fetch what will be added/skipped/manual.
    // Counterpart: src/kroger_mcp/web/routes/api/shopping_list.py
    // shopping_list_to_cart() returns the same shape with confirm:false.
    async openCartPreview() {
      if (this.previewLoading || this.items.length === 0) return;
      this.previewOpen = true;
      this.previewLoading = true;
      this.previewData = null;
      try {
        this.previewData = await window.api.post(
          '/api/shopping-list/add-to-cart',
          {confirm: false, modality: this.modality}
        );
      } catch (e) {
        this.previewOpen = false;
        this._showError(e);
      }
      this.previewLoading = false;
    },

    closeCartPreview() {
      if (this.sendBusy) return;
      this.previewOpen = false;
      this.previewData = null;
    },

    // Confirm step: actually add items to the Kroger cart.
    async confirmSendToCart() {
      if (this.sendBusy) return;
      this.sendBusy = true;
      try {
        const result = await window.api.post(
          '/api/shopping-list/add-to-cart',
          {confirm: true, modality: this.modality}
        );
        const parts = [result.message || `Sent ${result.items_added || 0} items to Kroger cart.`];
        if (result.warning) parts.push(result.warning);
        this._showSuccess(parts.join(' '));
        this.previewOpen = false;
        this.previewData = null;
        await this.reload();
      } catch (e) {
        this._showError(e);
      }
      this.sendBusy = false;
    },

    _showSuccess(text) {
      this.msg = text;
      this.msgLevel = 'success';
      setTimeout(() => { if (this.msgLevel === 'success') this.msg = ''; }, 6000);
    },

    _showError(e) {
      const m = (e && e.message) || 'Failed to send to Kroger cart';
      // 401 from the endpoint comes through window.api as the server's
      // detail string ("Not authenticated. Please log in via Claude first.").
      // Surface a Settings hint so the user knows where to go.
      this.msg = /not authenticated|unauthorized|401/i.test(m)
        ? 'Not authenticated. Connect your Kroger account in Settings.'
        : m;
      this.msgLevel = 'error';
      setTimeout(() => { if (this.msgLevel === 'error') this.msg = ''; }, 8000);
    },
  };
}
</script>


<div x-data="shoppingListData()">

  <!-- Status message -->
  <div x-show="msg" x-transition x-cloak
    :style="msgLevel === 'error'
      ? 'margin-bottom: 1rem; padding: 0.75rem 1rem; background: oklch(96% 0.02 25); border: 1px solid var(--danger); border-radius: 0.75rem; font-size: 0.875rem; color: var(--danger);'
      : 'margin-bottom: 1rem; padding: 0.75rem 1rem; background: var(--green-light); border: 1px solid var(--success); border-radius: 0.75rem; font-size: 0.875rem; color: var(--success);'"
    x-text="msg"></div>

  <!-- Shopping List table -->
  <div class="ss-card overflow-hidden mb-6">
    <div style="padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);" class="flex items-center justify-between">
      <h2 style="font-size: 0.875rem; font-weight: 600; color: var(--text-1);">
        Shopping List
        <span style="color: var(--text-3); font-weight: 400; margin-left: 0.25rem;" x-text="'(' + items.length + ' items)'"></span>
      </h2>
      <div x-show="items.length > 0" class="flex items-center gap-2">
        <button
          @click="clearList()"
          class="ss-btn-secondary"
          style="padding: 0.375rem 1rem; font-size: 0.75rem;"
        >
          Clear List
        </button>
        <button
          @click="openCartPreview()"
          :disabled="previewLoading"
          class="ss-btn-primary"
          style="padding: 0.375rem 1rem; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 0.375rem;"
        >
          <svg style="width:0.875rem;height:0.875rem;flex-shrink:0;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
          <span x-show="!previewLoading">Send to Kroger Cart</span>
          <span x-show="previewLoading" x-cloak>Loading…</span>
        </button>
      </div>
    </div>

    <div x-show="items.length === 0" style="text-align: center; padding: 3rem 1rem;">
      <svg style="width: 2.5rem; height: 2.5rem; margin: 0 auto 0.75rem; color: var(--border);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
      </svg>
      <p style="font-size: 0.875rem; color: var(--text-3);">Your shopping list is empty.</p>
    </div>

    <table x-show="items.length > 0" class="w-full text-sm">
      <thead>
        <tr>
          <th class="ss-table-th">Item</th>
          <th class="ss-table-th">Qty</th>
          <th class="ss-table-th">Recipe</th>
          <th class="ss-table-th" style="text-align: right;"></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="item in items" :key="item.id || item.product_id">
          <tr class="ss-table-tr">
            <td style="padding: 0.75rem 1.5rem;">
              <span style="font-weight: 500; color: var(--text-1);" x-text="displayName(item)"></span>
              <span
                x-show="item.manual_purchase"
                class="ss-badge ss-badge-warning ml-2"
              >Manual</span>
            </td>
            <td style="padding: 0.75rem 1rem;">
              <div class="flex items-center gap-1">
                <button @click="adjustQty(item, -1)"
                  class="ss-btn-secondary"
                  style="width: 1.5rem; height: 1.5rem; padding: 0; justify-content: center; font-size: 0.875rem;">−</button>
                <input type="number" :value="item.quantity || 1"
                  @change="setQty(item, $event.target.value)"
                  min="0.25" step="any"
                  class="ss-input"
                  style="width: 3rem; text-align: center; padding: 0.25rem;" />
                <button @click="adjustQty(item, 1)"
                  class="ss-btn-secondary"
                  style="width: 1.5rem; height: 1.5rem; padding: 0; justify-content: center; font-size: 0.875rem;">+</button>
                <span style="font-size: 0.75rem; color: var(--text-3); margin-left: 0.125rem;" x-text="item.unit || ''"></span>
              </div>
            </td>
            <td class="px-4 py-3 text-gray-500 text-xs" x-text="item.recipe_name || (item.sources && item.sources[0] && item.sources[0].recipe_name) || '—'"></td>
            <td style="padding: 0.75rem 1.5rem; text-align: right;">
              <button @click="removeItem(item.id, item.product_id)"
                style="color: var(--danger); background: none; border: none; cursor: pointer; padding: 0.25rem; line-height: 0; transition: opacity 0.12s;"
                onmouseenter="this.style.opacity='0.6'"
                onmouseleave="this.style.opacity='1'"
                title="Remove item">
                <svg style="width: 1rem; height: 1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
              </button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

  <!-- ── Send to Kroger Cart preview modal ── -->
  <!-- States: closed → previewLoading → preview shown → sendBusy → closed -->
  <div x-show="previewOpen" x-cloak
    @keydown.escape.window="closeCartPreview()"
    class="fixed inset-0 z-50 flex items-center justify-center p-4"
    style="background: rgba(0,0,0,0.45);">
    <div @click.self="closeCartPreview()" class="absolute inset-0"></div>

    <div class="relative bg-white rounded-xl shadow-2xl w-full max-w-lg max-h-[85vh] flex flex-col">
      <!-- Header -->
      <div class="flex items-center justify-between p-4 border-b border-gray-100 flex-shrink-0">
        <h3 style="font-family: 'Lora', serif; font-weight: 600; font-size: 1rem; color: var(--text-1);">
          Send to Kroger Cart
        </h3>
        <button @click="closeCartPreview()" :disabled="sendBusy"
          class="text-gray-400 hover:text-gray-600 disabled:opacity-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Body -->
      <div class="p-4 overflow-y-auto flex-1">
        <!-- Loading state -->
        <div x-show="previewLoading" class="text-center py-8 text-sm text-gray-500">
          Loading preview…
        </div>

        <template x-if="!previewLoading && previewData">
          <div>
            <!-- Modality picker -->
            <div class="mb-4">
              <div class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1.5">Fulfillment</div>
              <div class="inline-flex border border-gray-200 rounded-lg overflow-hidden text-sm">
                <button type="button"
                  @click="modality = 'PICKUP'; openCartPreview()"
                  :style="modality === 'PICKUP'
                    ? 'background: var(--green); color: white;'
                    : 'background: white; color: var(--text-2);'"
                  class="px-4 py-1.5 transition-colors">Pickup</button>
                <button type="button"
                  @click="modality = 'DELIVERY'; openCartPreview()"
                  :style="modality === 'DELIVERY'
                    ? 'background: var(--green); color: white;'
                    : 'background: white; color: var(--text-2);'"
                  class="px-4 py-1.5 border-l border-gray-200 transition-colors">Delivery</button>
              </div>
            </div>

            <!-- Will add -->
            <div class="mb-4">
              <div class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1.5">
                Will add (<span x-text="previewData.summary?.to_add ?? 0"></span>)
              </div>
              <template x-if="(previewData.items || []).length === 0">
                <p class="text-xs text-gray-400 italic">Nothing to add.</p>
              </template>
              <ul class="text-sm text-gray-700 space-y-1">
                <template x-for="it in (previewData.items || [])" :key="it.product_id">
                  <li class="flex justify-between gap-2">
                    <span x-text="it.name"></span>
                    <span class="text-gray-500 text-xs flex-shrink-0" x-text="'×' + it.quantity"></span>
                  </li>
                </template>
              </ul>
            </div>

            <!-- Will skip -->
            <template x-if="(previewData.items_to_skip || []).length > 0">
              <div class="mb-4">
                <div class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1.5">
                  Will skip (<span x-text="previewData.summary?.to_skip ?? 0"></span>)
                </div>
                <ul class="text-sm text-gray-600 space-y-1">
                  <template x-for="it in previewData.items_to_skip" :key="it.name">
                    <li>
                      <span x-text="it.name"></span>
                      <span class="text-gray-400 text-xs ml-1" x-text="'— ' + it.reason"></span>
                    </li>
                  </template>
                </ul>
              </div>
            </template>

            <!-- Manual purchase -->
            <template x-if="(previewData.manual_purchase || []).length > 0">
              <div class="mb-2">
                <div class="text-xs font-medium text-amber-700 uppercase tracking-wide mb-1.5">
                  Manual purchase (<span x-text="previewData.summary?.manual ?? 0"></span>)
                </div>
                <ul class="text-sm text-gray-600 space-y-1">
                  <template x-for="it in previewData.manual_purchase" :key="it.name">
                    <li>
                      <span x-text="it.name"></span>
                      <span class="text-gray-400 text-xs ml-1" x-text="it.notes ? '— ' + it.notes : ''"></span>
                    </li>
                  </template>
                </ul>
              </div>
            </template>
          </div>
        </template>
      </div>

      <!-- Footer -->
      <div class="flex justify-end gap-2 p-4 border-t border-gray-100 flex-shrink-0">
        <button @click="closeCartPreview()" :disabled="sendBusy"
          class="ss-btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.875rem;">
          Cancel
        </button>
        <button @click="confirmSendToCart()"
          :disabled="sendBusy || previewLoading || !previewData || (previewData.summary?.to_add ?? 0) === 0"
          class="ss-btn-primary" style="padding: 0.5rem 1rem; font-size: 0.875rem;">
          <span x-show="!sendBusy" x-text="'Send ' + (previewData?.summary?.to_add ?? 0) + ' items'"></span>
          <span x-show="sendBusy" x-cloak>Sending…</span>
        </button>
      </div>
    </div>
  </div>

</div>
{% endblock %}
