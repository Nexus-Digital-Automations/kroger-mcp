<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Smart Shopper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream:        oklch(97% 0.012 80);
      --surface:      oklch(99.5% 0.005 80);
      --border:       oklch(88% 0.018 80);
      --text-1:       oklch(18% 0.025 80);
      --text-2:       oklch(44% 0.03 80);
      --text-3:       oklch(62% 0.02 80);
      --green:        oklch(48% 0.14 148);
      --green-light:  oklch(88% 0.06 148);
      --amber:        oklch(72% 0.165 72);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--text-1);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px oklch(18% 0.025 80 / 0.06);
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-logo h1 {
      font-family: 'Lora', serif;
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--text-1);
      margin: 0 0 0.25rem;
    }
    .auth-logo p {
      font-size: 0.8125rem;
      color: var(--text-3);
      margin: 0;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 0.375rem;
      letter-spacing: 0.02em;
    }
    .form-group input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      font-size: 0.875rem;
      font-family: 'DM Sans', sans-serif;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: var(--surface);
      color: var(--text-1);
      outline: none;
      transition: border-color 0.15s;
    }
    .form-group input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px oklch(48% 0.14 148 / 0.1);
    }
    .btn-primary {
      width: 100%;
      padding: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      color: white;
      background: var(--green);
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
      letter-spacing: 0.01em;
    }
    .btn-primary:hover {
      background: oklch(44% 0.14 148);
      box-shadow: 0 2px 8px oklch(18% 0.025 80 / 0.12);
    }
    .error-msg {
      background: oklch(95% 0.06 25);
      color: oklch(40% 0.16 25);
      border: 1px solid oklch(88% 0.08 25);
      border-radius: 0.5rem;
      padding: 0.625rem 0.875rem;
      font-size: 0.8125rem;
      margin-bottom: 1.25rem;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.8125rem;
      color: var(--text-3);
    }
    .auth-footer a {
      color: var(--green);
      text-decoration: none;
      font-weight: 500;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <h1>Smart Shopper</h1>
      <p>Sign in to your account</p>
    </div>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Your password" />
      </div>
      <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="/register">Create one</a>
    </div>
  </div>
</body>
</html>
